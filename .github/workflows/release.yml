name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Read release version
        shell: powershell
        run: |
          $version = (& python -c "from dlforge import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid DLForge version: $version"
          }
          $tag = "v$version"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DLFORGE_VERSION=$version$([Environment]::NewLine)", [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DLFORGE_TAG=$tag$([Environment]::NewLine)", [System.Text.UTF8Encoding]::new($false))

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify Inno Setup
        shell: powershell
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction Stop
          Write-Host "Using $($compiler.Source)"

      - name: Prepare pinned media tools
        shell: powershell
        run: .\scripts\prepare_tools.ps1

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build branded offline installer
        shell: powershell
        run: .\scripts\build_installer.ps1

      - name: Build FFmpeg source asset
        shell: powershell
        run: .\scripts\prepare_ffmpeg_source.ps1

      - name: Verify packaged dependencies
        shell: powershell
        run: |
          $process = Start-Process -FilePath .\dist\DLForge\DLForge.exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged dependency self-test failed: $($process.ExitCode)" }

      - name: Verify release assets
        shell: powershell
        run: |
          $expected = @(
            "release\DLForge-$env:DLFORGE_VERSION-Setup-offline.exe",
            "release\DLForge-$env:DLFORGE_VERSION-Setup-offline.exe.sha256"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release asset: $path" }
          }
          $sourceArchives = @(Get-ChildItem -LiteralPath release -Filter "DLForge-$env:DLFORGE_VERSION-FFmpeg-source-*.zip" -File)
          if ($sourceArchives.Count -ne 1) { throw "Expected exactly one FFmpeg source archive, found $($sourceArchives.Count)." }
          if (-not (Test-Path -LiteralPath ($sourceArchives[0].FullName + ".sha256"))) {
            throw "Missing FFmpeg source checksum."
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: DLForge-v${{ env.DLFORGE_VERSION }}-windows-release
          if-no-files-found: error
          retention-days: 14
          path: |
            release/DLForge-${{ env.DLFORGE_VERSION }}-Setup-offline.exe
            release/DLForge-${{ env.DLFORGE_VERSION }}-Setup-offline.exe.sha256
            release/DLForge-${{ env.DLFORGE_VERSION }}-FFmpeg-source-*.zip
            release/DLForge-${{ env.DLFORGE_VERSION }}-FFmpeg-source-*.zip.sha256

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Resolve-Path "release\DLForge-$env:DLFORGE_VERSION-Setup-offline.exe").Path
          $installerHash = (Resolve-Path "release\DLForge-$env:DLFORGE_VERSION-Setup-offline.exe.sha256").Path
          $source = @(Get-ChildItem -LiteralPath release -Filter "DLForge-$env:DLFORGE_VERSION-FFmpeg-source-*.zip" -File)
          $sourceHash = @(Get-ChildItem -LiteralPath release -Filter "DLForge-$env:DLFORGE_VERSION-FFmpeg-source-*.zip.sha256" -File)
          if ($source.Count -ne 1 -or $sourceHash.Count -ne 1) { throw "Unable to resolve FFmpeg release assets." }
          $notesPath = Join-Path $env:RUNNER_TEMP "dlforge-release-notes.md"
          @(
            "本次更新重点改善平台分享链接的使用体验：",
            "",
            "- 默认开启剪贴板监听，复制受支持的视频链接后自动识别并解析",
            "- 支持从哔哩哔哩、抖音等平台的分享文案中提取链接，自动忽略文字描述",
            "- 解析或下载期间复制的新链接会排队，并在空闲后自动处理",
            "- 设置区新增“自动识别剪贴板链接”开关",
            "- 新增剪贴板轮询与混合文本链接提取测试",
            "",
            "安装包为完全离线版本，内置 Python 运行时、yt-dlp、FFmpeg 和 ffprobe，目标电脑无需配置环境。"
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8
          $assets = @($installer, $installerHash, $source[0].FullName, $sourceHash[0].FullName)
          & gh release create $env:DLFORGE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DLForge $env:DLFORGE_TAG" --notes-file $notesPath --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed." }
